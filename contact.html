<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="canonical" href="https://timeora.co/contact.html/">
<title>Contact | Timeora</title>
<meta name="description" content="Contact Timeora, a free online world clock, alarm, stopwatch and timer.">
<style>
:root{--bg:#14162b;--card:#1e2140;--card2:#2a2e57;--text:#eceaf6;--sub:#9a9cc0;--gray:#a3a5b8;--accent:#eceaf6;--field:#2d2f38;color-scheme:dark}
@media(prefers-color-scheme:light){:root{--bg:#f3f2fb;--card:#fff;--card2:#e4e2f4;--text:#1a1b33;--sub:#62648a;--gray:#6b6f7b;--accent:#1a1b33;--field:#eceef1;color-scheme:light}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;line-height:1.7}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 40px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
header a{color:var(--text);font-weight:600;font-size:1.25rem;text-decoration:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:var(--card2);padding:8px 16px;border-radius:999px}
:focus-visible{outline:2px solid var(--gray);outline-offset:2px}
main{background:var(--card);border-radius:16px;padding:8px 24px 28px}
h1{font-size:1.6rem;margin:20px 0 4px}
h2{font-size:1.1rem;margin:24px 0 4px;color:var(--gray);font-weight:700}
p{margin:6px 0}
a{color:var(--accent);text-decoration:underline}
footer{text-align:center;margin-top:20px;font-size:.85rem;color:var(--sub)}
footer a{color:var(--sub)}
form label{display:block;margin:20px 0 6px;font-weight:700;color:var(--gray)}
form input,form textarea{width:100%;background:var(--field);color:inherit;border:1px solid transparent;border-radius:10px;padding:12px 14px;font:inherit}
form textarea{min-height:180px;resize:vertical}
.send{background:var(--text);color:var(--bg);font-weight:700;padding:12px 32px;margin-top:22px}
.send:disabled{opacity:.5;cursor:default}
.note{color:var(--sub);font-size:.85rem;margin-top:16px}
#cstatus{min-height:1.7em;margin-top:14px;font-weight:600;color:var(--gray)}
</style>
</head>
<body>
<div class="wrap">
<header><a href="index.html">Timeora</a><button id="langBtn"></button></header>
<main>
<h1 data-k="title"></h1>
<form id="cform" novalidate>
<label for="cn" data-k="name"></label>
<input id="cn" type="text" required maxlength="80" autocomplete="name">
<label for="ce" data-k="email"></label>
<input id="ce" type="email" required maxlength="120" autocomplete="email">
<label for="cm" data-k="message"></label>
<textarea id="cm" required maxlength="3000"></textarea>
<input type="checkbox" id="cb" tabindex="-1" autocomplete="off" aria-hidden="true" style="display:none">
<p class="note"><span data-k="note"></span> <a href="privacy.html" data-k="privacy"></a></p>
<p id="cstatus" role="status"></p>
<button type="submit" id="csend" class="send" data-k="send"></button>
</form>
</main>
<footer><a href="index.html">&larr; Timeora</a> &middot; <a href="privacy.html" id="fp"></a> &middot; &copy; 2026 timeora.com</footer>
</div>
<script src="langs.js"></script>
<script>
/* Web3Forms access key. It is public by design and forwards messages to the site owner's inbox without exposing the address. */
const WEB3FORMS_KEY='f5dbe1ca-45be-4428-9f94-0d7a387bf76c';
const KEYS='title,name,email,message,send,note,sending,ok,fail,invalid'.split(',');
const T={
en:{title:'Contact',name:'Name',email:'Email',message:'Message',send:'Send',note:'The information you enter is used only to reply to you.',sending:'Sending…',ok:'Your message has been sent. Thank you.',fail:'The message could not be sent. Please try again later.',notready:'The contact form is not connected yet.',invalid:'Please fill in every field with a valid email address.'},
ko:{title:'문의처',name:'이름',email:'전자 메일',message:'메시지',send:'보내기',note:'입력하신 정보는 답변을 위해서만 사용됩니다.',sending:'보내는 중입니다…',ok:'문의가 전송되었습니다. 감사합니다.',fail:'전송하지 못했습니다. 잠시 후 다시 시도해 주십시오.',notready:'문의 양식이 아직 연결되지 않았습니다.',invalid:'모든 항목을 입력하고 올바른 전자 메일 주소를 적어 주십시오.'}
};
const TX={
ja:['お問い合わせ','お名前','メールアドレス','メッセージ','送信','入力いただいた情報は、返信のためにのみ使用します。','送信中…','送信しました。ありがとうございます。','送信できませんでした。しばらくしてからもう一度お試しください。','すべての項目を入力し、正しいメールアドレスを入力してください。'],
zh:['联系我们','姓名','电子邮箱','留言','发送','您填写的信息仅用于回复您。','发送中…','已发送，谢谢。','发送失败，请稍后再试。','请填写所有项目，并输入有效的电子邮箱。'],
es:['Contacto','Nombre','Correo electrónico','Mensaje','Enviar','La información que introduces solo se usa para responderte.','Enviando…','Mensaje enviado. Gracias.','No se pudo enviar el mensaje. Inténtalo de nuevo más tarde.','Rellena todos los campos con un correo electrónico válido.'],
pt:['Contato','Nome','E-mail','Mensagem','Enviar','As informações inseridas são usadas apenas para responder a você.','Enviando…','Mensagem enviada. Obrigado.','Não foi possível enviar a mensagem. Tente novamente mais tarde.','Preencha todos os campos com um e-mail válido.'],
fr:['Contact','Nom','E-mail','Message','Envoyer','Les informations saisies servent uniquement à vous répondre.','Envoi en cours…','Message envoyé. Merci.','Le message n’a pas pu être envoyé. Veuillez réessayer plus tard.','Remplissez tous les champs avec une adresse e-mail valide.'],
de:['Kontakt','Name','E-Mail','Nachricht','Senden','Deine Angaben werden nur zur Beantwortung verwendet.','Wird gesendet…','Nachricht gesendet. Danke.','Die Nachricht konnte nicht gesendet werden. Bitte versuche es später erneut.','Bitte fülle alle Felder mit einer gültigen E-Mail-Adresse aus.'],
id:['Kontak','Nama','Email','Pesan','Kirim','Informasi yang Anda masukkan hanya digunakan untuk membalas Anda.','Mengirim…','Pesan terkirim. Terima kasih.','Pesan gagal dikirim. Coba lagi nanti.','Isi semua kolom dengan alamat email yang valid.'],
vi:['Liên hệ','Tên','Email','Tin nhắn','Gửi','Thông tin bạn nhập chỉ dùng để phản hồi bạn.','Đang gửi…','Đã gửi tin nhắn. Cảm ơn bạn.','Không gửi được tin nhắn. Vui lòng thử lại sau.','Vui lòng điền đủ các mục và nhập email hợp lệ.'],
ru:['Контакты','Имя','Электронная почта','Сообщение','Отправить','Введённые данные используются только для ответа вам.','Отправка…','Сообщение отправлено. Спасибо.','Не удалось отправить сообщение. Попробуйте позже.','Заполните все поля и укажите действительный адрес электронной почты.']
};
Object.keys(TX).forEach(c=>{T[c]={};KEYS.forEach((k,i)=>{T[c][k]=TX[c][i]})});
const tx=k=>(T[lang]&&T[lang][k])||T.en[k];
let lang=pickLang();
const $=s=>document.querySelector(s);
function apply(){
document.documentElement.lang=lang;
document.querySelectorAll('[data-k]').forEach(e=>{e.textContent=e.dataset.k==='privacy'?langInfo(lang)[3]:tx(e.dataset.k)});
$('#fp').textContent=langInfo(lang)[3];
document.title=langInfo(lang)[2]+' | Timeora';
if(typeof langLabel==='function')langLabel();
}
const langLabel=initLangMenu($('#langBtn'),()=>lang,l=>{lang=l;apply()});
$('#cform').addEventListener('submit',async e=>{
e.preventDefault();
const st=$('#cstatus'),btn=$('#csend'),n=$('#cn').value.trim(),m=$('#ce').value.trim(),msg=$('#cm').value.trim();
if(!n||!msg||!$('#ce').checkValidity()||!m){st.textContent=tx('invalid');return}
if($('#cb').checked){st.textContent=tx('ok');return}
if(WEB3FORMS_KEY.indexOf('YOUR_')===0){st.textContent=tx('notready');return}
btn.disabled=true;st.textContent=tx('sending');
try{
const r=await fetch('https://api.web3forms.com/submit',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({access_key:WEB3FORMS_KEY,subject:'Timeora 문의 / Contact',from_name:'Timeora',name:n,email:m,message:msg})});
const j=await r.json();
if(!j.success)throw new Error('send failed');
$('#cform').reset();st.textContent=tx('ok');
}catch(err){st.textContent=tx('fail')}
btn.disabled=false;
});
apply();
</script>
</body>
</html>
